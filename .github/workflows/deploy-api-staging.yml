name: Deploy API to Staging Container App

on:
  push:
    branches:
      - main
    paths:
      - 'ActionBridge-Ado.Api/**'  # only run when API code changes

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write   # required for OIDC login
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name actionbridgeacr

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/actionbridge-api:${{ github.sha }}
          docker build -t $IMAGE ./ActionBridge-Ado.Api
          docker push $IMAGE

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.CONTAINER_APP_RG }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/actionbridge-api:${{ github.sha }}